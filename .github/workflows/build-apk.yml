name: Gerar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Criar projeto Android (Capacitor)
        run: |
          mkdir -p app/www
          cp index.html app/www/index.html
          cd app
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor-community/text-to-speech@6
          npx cap init "Sonic Rewrite" com.sonicrewrite.game --web-dir=www
          npx cap add android
          npx cap sync android
          # sempre deitado
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          # tela cheia (esconde barra de status e de navegação) e tela sempre acesa
          cat > android/app/src/main/java/com/sonicrewrite/game/MainActivity.java <<'EOF'
          package com.sonicrewrite.game;

          import android.os.Bundle;
          import android.view.WindowManager;
          import androidx.core.view.WindowCompat;
          import androidx.core.view.WindowInsetsCompat;
          import androidx.core.view.WindowInsetsControllerCompat;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  hideBars();
              }

              @Override
              public void onWindowFocusChanged(boolean hasFocus) {
                  super.onWindowFocusChanged(hasFocus);
                  if (hasFocus) hideBars();
              }

              private void hideBars() {
                  WindowCompat.setDecorFitsSystemWindows(getWindow(), false);
                  WindowInsetsControllerCompat c = WindowCompat.getInsetsController(getWindow(), getWindow().getDecorView());
                  c.hide(WindowInsetsCompat.Type.systemBars());
                  c.setSystemBarsBehavior(WindowInsetsControllerCompat.BEHAVIOR_SHOW_TRANSIENT_BARS_BY_SWIPE);
              }
          }
          EOF

      - name: Compilar APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SonicRewrite-APK
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
